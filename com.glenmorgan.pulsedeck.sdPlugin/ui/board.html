<!doctype html>
<html>

<head lang="en">
  <meta charset="utf-8" />
  <script src="sdpi-components.js"></script>
</head>

<body>
  <!--
    One button, by design.

    A board's configuration lives in the manager window: services, their overrides, the order they
    sit in on the key, and the defaults they inherit. This inspector held fields for adding a
    service while the window was being built; keeping them now would mean two places to add one,
    which would disagree the first time either changed.

    Stream Deck always shows something when a key is selected, so an empty inspector reads as
    broken — hence a button and a sentence rather than nothing at all.
  -->
  <sdpi-item label="Board">
    <sdpi-button id="manage">Open manager</sdpi-button>
  </sdpi-item>

  <sdpi-item label="">
    <sdpi-item-value>
      Services, thresholds and ordering are all managed in the window. You can also open it with a
      short press on the key; hold the key to check every service now.
    </sdpi-item-value>
  </sdpi-item>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('manage').addEventListener('click', () => {
        SDPIComponents.streamDeckClient.send('sendToPlugin', { event: 'openManager' });
      });
    });
  </script>
</body>

</html>
